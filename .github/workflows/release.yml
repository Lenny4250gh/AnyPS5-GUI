name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Badge - publishing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/setbadge.sh <<'SH'
          #!/usr/bin/env bash
          set -e
          msg="$1"; color="$2"
          cd "$(mktemp -d)"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin badges; then
            git checkout -q -B badges FETCH_HEAD
          else
            git checkout -q --orphan badges
          fi
          printf '{"schemaVersion":1,"label":"NEW RELEASE","message":"%s","color":"%s"}\n' "$msg" "$color" > release.json
          git add release.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Release badge: $msg"
          git push -q origin badges
          SH
          chmod +x /tmp/setbadge.sh
          /tmp/setbadge.sh publishing blue

      - name: Find the finished build for this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml \
            --commit "$GITHUB_SHA" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful build found for commit $GITHUB_SHA. Run the Build workflow on this commit first, then push the tag again."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      - name: Badge - result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success)   /tmp/setbadge.sh idle yellow ;;
            cancelled) /tmp/setbadge.sh cancelled lightgrey ;;
            *)         /tmp/setbadge.sh failing red ;;
          esac
