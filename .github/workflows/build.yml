name: Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: "1"
            name: windows
          - os: macos-latest
            target: "2"
            name: macos
          - os: ubuntu-latest
            target: "3"
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Linux system libraries (Qt)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3

      - name: Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pywebview pypresence
          if [ "${{ matrix.name }}" = "linux" ]; then pip install "pywebview[qt]" PyQt5 PyQtWebEngine qtpy; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build
        run: python build.py ${{ matrix.target }}

      - name: Rename output
        shell: bash
        run: |
          mkdir release
          case "${{ matrix.name }}" in
            windows) cp dist/AnyPS5_GUI.exe release/AnyPS5_GUI-windows.exe ;;
            linux)   cp dist/AnyPS5_GUI release/AnyPS5_GUI-linux ;;
            macos)   ditto -c -k --keepParent dist/AnyPS5_GUI.app release/AnyPS5_GUI-macos.zip ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: AnyPS5_GUI-${{ matrix.name }}
          path: release/*
          retention-days: 90