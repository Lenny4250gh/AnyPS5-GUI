name: Build and release

on:
  push:
    tags: ["v*"]        # e.g. git tag v1.0.0 -> builds + publishes a Release
  workflow_dispatch:     # manual run from the Actions tab (artifacts only, no Release)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: "1"
            name: windows
          - os: macos-latest
            target: "2"
            name: macos
          - os: ubuntu-latest
            target: "3"
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Linux system libraries (Qt)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3

      - name: Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pywebview
          if [ "${{ matrix.name }}" = "linux" ]; then pip install "pywebview[qt]" PyQt5 PyQtWebEngine qtpy; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build
        run: python build.py ${{ matrix.target }}

      - name: Rename output (names used in the README)
        shell: bash
        run: |
          mkdir release
          case "${{ matrix.name }}" in
            windows) cp dist/AnyPS5_GUI.exe release/AnyPS5_GUI-windows.exe ;;
            linux)   cp dist/AnyPS5_GUI release/AnyPS5_GUI-linux ;;
            macos)   ditto -c -k --keepParent dist/AnyPS5_GUI.app release/AnyPS5_GUI-macos.zip ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: AnyPS5_GUI-${{ matrix.name }}
          path: release/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
